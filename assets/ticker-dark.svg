<svg xmlns="http://www.w3.org/2000/svg" width="800" height="44" viewBox="0 0 800 44" role="img" aria-label="Rotating highlights">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px}
.f{fill:#8b949e;opacity:0;animation:slide 17.5s infinite}
.b{fill:#e6edf3;font-weight:700}
@keyframes slide{0%{opacity:0;transform:translateY(10px)}4%,17%{opacity:1;transform:translateY(0)}21%,100%{opacity:0;transform:translateY(-10px)}}
</style>
<circle cx="30" cy="22" r="4" fill="#2da44e"/>
<circle cx="30" cy="22" r="4" fill="none" stroke="#2da44e" stroke-width="2"><animate attributeName="r" values="4;13" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="52" y="28" class="f" style="animation-delay:0.0s"><tspan class="b">642</tspan> commits in the last 12 months</text>
<text x="52" y="28" class="f" style="animation-delay:3.5s"><tspan class="b">TypeScript</tspan> is my most used language</text>
<text x="52" y="28" class="f" style="animation-delay:7.0s"><tspan class="b">5</tspan> IndiaSkills awards across two editions</text>
<text x="52" y="28" class="f" style="animation-delay:10.5s"><tspan class="b">Live graphics</tspan> at BGMS 2026 Grand Finals</text>
<text x="52" y="28" class="f" style="animation-delay:14.0s"><tspan class="b">548</tspan> commits so far in 2026</text>
</svg>