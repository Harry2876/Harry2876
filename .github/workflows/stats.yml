name: Update stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        run: node .github/scripts/stats.mjs
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --cached --quiet || (git commit -m "Update stats cards" && git push)