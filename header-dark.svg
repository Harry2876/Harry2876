<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-label="Hariom Harsh, Backend and Native Android Developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#818cf8"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.name{font-size:44px;font-weight:700;fill:#e6edf3;animation:rise 1s ease-out both}
.t{font-size:18px;fill:#8b949e;opacity:0;animation:cycle 9s infinite}
.t1{animation-delay:0s}.t2{animation-delay:3s}.t3{animation-delay:6s}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
<text x="400" y="62" text-anchor="middle" class="name">Hariom Harsh</text>
<text x="400" y="104" text-anchor="middle" class="t t1">Backend Engineer  ·  Node.js  ·  PostgreSQL  ·  Redis</text>
<text x="400" y="104" text-anchor="middle" class="t t2">Native Android  ·  Kotlin  ·  Jetpack Compose</text>
<text x="400" y="104" text-anchor="middle" class="t t3">Computer Vision  ·  Live Esports Broadcast Tech</text>
<rect x="300" y="128" width="200" height="3" rx="1.5" fill="url(#g)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>